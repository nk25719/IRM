name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  APP_ENV: test
  DATABASE_URL: postgresql+psycopg://irm_test:irm_test@localhost:5432/irm_test
  SESSION_SECRET: ci-test-secret-change-me-32-characters
  APP_USERNAME: ci-admin
  APP_PASSWORD: ci-password

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall app alembic tests
      - name: Run unit tests
        run: python -m unittest discover -s tests/unit -v

  static_frontend:
    name: Static/frontend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: pm-frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Build PM frontend
        run: npm ci && npm run build
        working-directory: pm-frontend
      - name: Run static layout tests
        run: python -m unittest tests.test_static_layout -v

  postgres:
    name: PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: irm_test
          POSTGRES_USER: irm_test
          POSTGRES_PASSWORD: irm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U irm_test -d irm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run migrations
        run: alembic upgrade head
      - name: Run PostgreSQL integration tests
        run: python -m unittest discover -s tests/postgres -v

  legacy_compatibility:
    name: Legacy compatibility debt
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run legacy SQLite-dependent tests
        run: python -m unittest discover -s tests -v
